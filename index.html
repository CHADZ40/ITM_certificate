<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITM Innovation Hackathon</title>
  <link rel="stylesheet" href="ITM_certificate/assets/css/main.css">
  <link rel="Icon" href="ITM_certificate/assets/Images/ITM_logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

</head>

<body>
  <header>
    <img src="ITM_certificate/assets/Images/ITM_logo.png" alt="Logo" width="60px">
    <i class="fa-solid fa-users"></i>
  </header>
  <div class="banner">
    <div class="banner_content">
      <div class="banner_badge">
        <span class="badge_dot"></span>
        <span>2026 Batch</span>
      </div>
      <h1>ITM Innovation <span class="accent_text">Hackathon</span></h1>
      <p class="banner_sub">Official Certificate Portal & Participant Verification</p>
    </div>
    <div class="download_below" role="button" aria-label="Scroll down to certificates">
      <p>Download Your Certificate below</p>
      <span><i class="fa-solid fa-chevron-down"></i></span>
    </div>
  </div>
  <div class="search_bar">
    <div class="search_input_wrapper">
      <i class="fa-solid fa-magnifying-glass search_icon"></i>
      <input type="search" placeholder="Search participant name..." id="certificate-search" autocomplete="off">
    </div>
  </div>
  <main>
    <div class="certificate"></div>
  </main>
  <script src="ITM_certificate/assets/js/script.js"></script>
</body>

</html>
